    <canvas id="ringdown-sum-44" class="ringdown-mode" style="left: 1170px;" width="600" height="600"></canvas>

    <div class="ringdown-lm ringdown-sum-lm" style="left: 1090px;">$\ell m = 33$</div>
    <div class="ringdown-lm ringdown-sum-lm" style="left: 1470px;">$\ell m = 44$</div>
