<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>example</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="common/deck.css">
<link rel="stylesheet" href="parts/example/part.css">
</head>
<body>
<div class="deck">
<!-- part: example -->
<section class="slide" id="example-title">
  <h1 class="title">Title</h1>
</section>

<section class="slide" id="example-math">
  <h1 class="title">Math</h1>
  <div class="example-center">
    $$G_{\mu\nu} = \frac{8\pi G}{c^4} T_{\mu\nu}$$
    $$h(t) = \sum_{\ell m n} A_{\ell m n}\, e^{-t/\tau_{\ell m n}} \cos(\omega_{\ell m n} t + \phi_{\ell m n})$$
  </div>
</section>

<section class="slide" id="example-reveal">
  <h1 class="title">Steps</h1>
  <div class="example-center">
    <p data-step="1">$\ell = 2$</p>
    <p data-step="2">$\ell = 3$</p>
    <p data-step="3">$\ell = 4$</p>
  </div>
</section>

<section class="slide" id="example-anim">
  <h1 class="title">Animation stages</h1>
  <canvas id="example-anim-canvas" class="example-canvas" width="1600" height="700"></canvas>
</section>

<section class="slide" id="example-widget">
  <h1 class="title">Interactive</h1>
  <canvas id="example-widget-canvas" class="example-canvas" width="1600" height="700"></canvas>
  <div class="example-control">
    $\tau$ <input id="example-widget-tau" type="range" min="0.05" max="1" step="0.01" value="0.3">
  </div>
</section>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="common/deck.js"></script>
<script src="parts/example/part.js"></script>
<script>Deck.start();</script>
</body>
</html>
